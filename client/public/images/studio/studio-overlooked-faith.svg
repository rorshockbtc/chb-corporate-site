<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <rect width="1200" height="750" fill="#F2EAE0" />
  <rect x="60" y="55" width="1080" height="640" fill="none" stroke="#281B16" stroke-width="2" />
  <!-- Left: Josef Albers Homage to the Square -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="290" height="290" fill="#D49546" stroke="#281B16" stroke-width="1.5" />
    <rect x="36" y="48" width="218" height="218" fill="#C45C3E" />
    <rect x="78" y="96" width="134" height="134" fill="#FE299E" />
  </g>
  <!-- Bottom Left: Golden Ratio Compass Arc -->
  <path d="M150,620 L410,620 A260,260 0 0,0 150,360 Z" fill="#EAE0D0" stroke="#281B16" stroke-width="2" />
  <line x1="150" y1="620" x2="334" y2="436" stroke="#FE299E" stroke-width="2" />
  <!-- Right: Sanctuary Timber & Stone Elevation -->
  <g transform="translate(520, 110)" stroke="#281B16" stroke-width="2.2" fill="#EAE0D0">
    <polygon points="260,0 20,320 500,320" />
    <rect x="55" y="320" width="410" height="200" />
    <path d="M160,520 L160,340 Q260,210 360,340 L360,520 Z" fill="#F2EAE0" />
    <line x1="260" y1="0" x2="260" y2="520" stroke="#FE299E" stroke-width="1.8" stroke-dasharray="6 4" />
    <line x1="0" y1="520" x2="520" y2="520" stroke-width="3" />
  </g>
</svg>
